name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

  DHI_USERNAME: "${{ secrets.DHI_USERNAME }}"
  DHI_PASSWORD: "${{ secrets.DHI_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DHI if needed
        shell: bash
        run: |
          set -euo pipefail

          need_dhi=false

          extract_image() {
            local line="$1"
            awk '{print $NF}' <<< "$line"
          }

          detect_registry() {
            local image="$1"
            image="${image%%@*}"

            local first_part="${image%%/*}"

            if [[ "$image" != */* ]]; then
              echo "docker.io"
              return
            fi

            if [[ "$first_part" == *.* || "$first_part" == *:* || "$first_part" == "localhost" ]]; then
              echo "$first_part"
            else
              echo "docker.io"
            fi
          }

          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
              continue
            fi

            image="$(extract_image "$line")"
            registry="$(detect_registry "$image")"

            echo "Detected image: $image"
            echo "Detected registry: $registry"

            if [[ "$registry" == "dhi.io" ]]; then
              need_dhi=true
              break
            fi
          done < images.txt

          echo "need_dhi=$need_dhi"

          if [[ "$need_dhi" == "true" ]]; then
            if [[ -n "${DHI_USERNAME:-}" && -n "${DHI_PASSWORD:-}" ]]; then
              echo "$DHI_PASSWORD" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin
            else
              echo "DHI images detected, but DHI_USERNAME / DHI_PASSWORD not set."
              exit 1
            fi
          fi

      - name: Build and push image Aliyun
        shell: bash
        run: |
          set -euo pipefail

          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_REGISTRY_USER" --password-stdin

          extract_image() {
            local line="$1"
            awk '{print $NF}' <<< "$line"
          }

          normalize_image() {
            local image="$1"
            image="${image%%@*}"
            echo "$image"
          }

          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
              continue
            fi

            image="$(extract_image "$line")"
            image="$(normalize_image "$image")"
            echo "image $image"

            image_name_tag="$(echo "$image" | awk -F'/' '{print $NF}')"
            echo "image_name_tag $image_name_tag"

            name_space="$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')"
            echo "name_space: $name_space"

            name_space="${name_space}_"

            image_name="$(echo "$image_name_tag" | awk -F':' '{print $1}')"
            echo "image_name: $image_name"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
              continue
            fi

            echo "docker pull $line"
            docker pull $line

            platform="$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')"
            echo "platform is $platform"

            if [ -z "$platform" ]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"

            image="$(extract_image "$line")"
            image="$(normalize_image "$image")"

            image_name_tag="$(echo "$image" | awk -F'/' '{print $NF}')"
            name_space="$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')"
            image_name="$(echo "$image_name_tag" | awk -F':' '{print $1}')"

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
              if [[ -n "${name_space}" ]]; then
                name_space_prefix="${name_space}_"
              fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "docker tag $image $new_image"
            docker tag "$image" "$new_image"

            echo "docker push $new_image"
            docker push "$new_image"

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="

            docker rmi "$image" || true
            docker rmi "$new_image" || true

            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
          done < images.txt
